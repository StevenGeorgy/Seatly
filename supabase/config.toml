# Supabase project config for Edge Functions.
#
# Every function below that performs its own JWT decoding must set
# verify_jwt = false — otherwise the gateway rejects ES256-signed session
# tokens (from the migrated JWT Signing Keys) with
# "UNSUPPORTED_TOKEN_ALGORITHM" before our code ever runs.

project_id = "exbjodmnpdiayfzrdyux"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "cenaiva://reset-password",
  "cenaiva://**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
]

